<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Hearth &amp; Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hearth &amp; Ledger">
<meta name="theme-color" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">
<style>
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  background: #f2f2f7; color: #000;
  overscroll-behavior: none; overflow-x: hidden;
  -webkit-user-select: none; user-select: none;
}
input, textarea, select { -webkit-user-select: auto; user-select: auto; }
* { -webkit-touch-callout: none; }
img { max-width: 100%; -webkit-user-drag: none; }
.content { padding: env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom)); min-height: 100vh; }
.screen { padding: 6px 16px 8px; max-width: 640px; margin: 0 auto; }
.navbar { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 0 10px; }
.large-title { font-size: 34px; font-weight: 800; letter-spacing: 0.2px; }
.nav-subtitle { font-size: 13px; color: #8e8e93; margin-top: 3px; }
.nav-btn { border: 0; background: none; color: #2d6a4f; font-size: 17px; font-weight: 600; padding: 6px 2px; font-family: inherit; }

.group-wrap { margin: 18px 0 0; }
.group-title { font-size: 13px; color: #6d6d72; letter-spacing: 0.4px; padding: 0 16px 7px; font-weight: 600; }
.group { background: #fff; border-radius: 12px; overflow: hidden; }
.group-footer { font-size: 12px; color: #8e8e93; padding: 7px 16px 0; line-height: 1.45; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; position: relative; min-height: 46px; }
.row + .row::before, .rentrow + .rentrow::before, .frow + .frow::before, .row + .frow::before, .frow + .row::before, .rentgrid-block + .rentgrid-block::before, .row + .rentrow::before {
  content: ''; position: absolute; left: 16px; right: 0; top: 0; height: 0.5px; background: rgba(60,60,67,0.29);
}
.tappable:active { background: #e5e5ea; }
.row-main { flex: 1; min-width: 0; }
.row-label { font-size: 17px; }
.row-label.danger { color: #ff3b30; }
.row-sub { font-size: 13px; color: #8e8e93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-value { font-size: 16px; color: #8e8e93; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-value.green, .green { color: #1f7a4d !important; }
.row-value.red, .red { color: #cc3b30 !important; }
.row-value.tint { color: #2d6a4f !important; font-size: 22px; font-weight: 500; }
.chevron { color: #c7c7cc; font-size: 22px; line-height: 1; font-weight: 400; }
.clip { font-size: 15px; }

.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.pill-paid { background: rgba(31,122,77,0.12); color: #1f7a4d; }
.pill-partial { background: rgba(200,140,40,0.15); color: #b07716; }
.pill-unpaid { background: rgba(204,59,48,0.1); color: #cc3b30; }
.pill-ended { background: rgba(200,140,40,0.15); color: #b07716; }
.pill-past { background: #e5e5ea; color: #8e8e93; }

.kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 4px; }
.kpi { background: #fff; border-radius: 12px; padding: 12px 12px 11px; }
.kpi-l { font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.4px; }
.kpi-v { font-size: 17px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

.rentgrid-block { padding: 12px 16px; position: relative; }
.rentgrid-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.rentgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.rentcell { min-width: 0; text-align: center; border-radius: 6px; padding: 6px 0 4px; }
.rentcell-m { font-size: 9px; font-weight: 700; }
.rentcell-v { font-size: 8.5px; margin-top: 1px; overflow: hidden; }
.rc-paid { background: #2d6a4f; color: #fff; }
.rc-missed { background: rgba(204,59,48,0.1); color: #cc3b30; border: 1px solid rgba(204,59,48,0.35); }
.rc-future { background: #f2f2f7; color: #c7c7cc; }

.yoy { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 4px; padding: 16px 16px 4px; height: 130px; align-items: end; }
.yoy-col { display: flex; flex-direction: column; align-items: center; height: 100%; min-width: 0; }
.yoy-bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.yoy-bar { width: 5px; border-radius: 2px 2px 0 0; }
.yoy-prev { background: #d8c9a3; }
.yoy-cur { background: #2d6a4f; }
.yoy-m { font-size: 9px; color: #8e8e93; margin-top: 4px; }
.yoy-legend { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: #6d6d72; padding: 4px 0 12px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.dot-prev { background: #d8c9a3; } .dot-cur { background: #2d6a4f; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(118,118,128,0.12); border-radius: 9px; padding: 2px; margin-top: 4px; }
.seg-item { border: 0; background: none; padding: 6px 0; font-size: 13px; font-weight: 500; border-radius: 7px; color: #000; font-family: inherit; }
.seg-active { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.12); font-weight: 600; }

.month-stepper { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 12px; margin-top: 14px; padding: 4px 6px; }
.step-btn { border: 0; background: none; color: #2d6a4f; font-size: 28px; padding: 2px 16px; font-family: inherit; }
.step-label { font-size: 17px; font-weight: 600; }
.rentrow { padding: 12px 16px; position: relative; }
.rentrow-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rentrow-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.mini-btn { border: 0; background: #2d6a4f; color: #fff; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 16px; font-family: inherit; }
.mini-btn:active { opacity: 0.75; }
.mini-2nd { background: rgba(118,118,128,0.12); color: #000; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px 8px calc(4px + env(safe-area-inset-bottom));
  background: rgba(249,249,249,0.92);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid rgba(60,60,67,0.29);
}
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #999ea4; padding: 3px 0 2px; font-family: inherit; }
.tab-active { color: #2d6a4f; }
.tab-label { font-size: 10px; font-weight: 500; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end; }
.sheet { background: #f2f2f7; width: 100%; border-radius: 14px 14px 0 0; padding: 6px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; animation: up 0.25s ease-out; }
.sheet-tall { min-height: 60vh; }
@keyframes up { from { transform: translateY(40%); opacity: 0.6; } to { transform: none; opacity: 1; } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: #c7c7cc; margin: 4px auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px; }
.sheet-title { font-size: 17px; font-weight: 600; }
.sheet-btn { border: 0; background: none; color: #2d6a4f; font-size: 17px; font-family: inherit; width: 60px; text-align: left; }
.frow { display: flex; align-items: center; padding: 7px 16px; min-height: 46px; position: relative; gap: 12px; }
.frow-label { font-size: 17px; flex-shrink: 0; min-width: 92px; }
.frow-ctl { flex: 1; min-width: 0; }
.finput { width: 100%; border: 0; background: none; font-size: 17px; text-align: right; font-family: inherit; color: #2d6a4f; outline: none; }
.fselect { border: 0; background: none; font-size: 16px; font-family: inherit; color: #2d6a4f; width: 100%; text-align: right; outline: none; direction: rtl; }
.fselect option { direction: ltr; }
.bigbtn { display: block; width: 100%; border: 0; background: #2d6a4f; color: #fff; font-size: 17px; font-weight: 600; padding: 14px; border-radius: 12px; margin-top: 16px; font-family: inherit; }
.bigbtn:active { opacity: 0.8; }
.bigbtn-danger { background: none; color: #ff3b30; padding: 10px; margin-top: 8px; }
.bigbtn-2nd { background: #fff; color: #2d6a4f; }
.thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; }

.stmt-overlay { position: fixed; inset: 0; z-index: 300; background: #f2f2f7; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.stmt-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 0.5px solid rgba(60,60,67,0.29); background: rgba(249,249,249,0.94); }
.stmt-frame { flex: 1; border: 0; width: 100%; background: #fff; }

/* ---- period-aware rent views ---- */
.kpis-4 { grid-template-columns: 1fr 1fr; }
.kpis-3 { grid-template-columns: 1fr 1fr 1fr; margin-top: 10px; }
.unitcard { padding: 13px 16px 14px; }
.unitcard + .unitcard { border-top: 1px solid rgba(60,60,67,0.12); }
.unitcard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.unitcard-body { margin-top: 11px; }
.prow-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.prow-line .row-sub { white-space: normal; }
.bar { height: 6px; border-radius: 3px; background: rgba(60,60,67,0.12); overflow: hidden; margin-top: 6px; }
.bar-fill { height: 100%; border-radius: 3px; }
.bf-full { background: #1f7a4d; }
.bf-part { background: #d19a2e; }
.bf-none { background: transparent; }
.pstrip { display: flex; gap: 4px; margin-top: 11px; flex-wrap: wrap; }
.pcell { flex: 1 1 22px; min-width: 22px; text-align: center; font-size: 10.5px; font-weight: 700;
         padding: 5px 0; border-radius: 5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.pc-settled { background: #2d6a4f; color: #fff; }
.pc-partial { background: #d19a2e; color: #fff; }
.pc-due { background: #cc3b30; color: #fff; }
.pc-upcoming { background: rgba(60,60,67,0.1); color: #8e8e93; }
.periodrow { padding: 12px 16px 13px; }
.periodrow + .periodrow { border-top: 1px solid rgba(60,60,67,0.12); }
.periodrow-now { background: rgba(45,106,79,0.06); box-shadow: inset 3px 0 0 #2d6a4f; }
.prow-pays { margin-top: 7px; padding-top: 7px; border-top: 1px dashed rgba(60,60,67,0.18); }
.prow-pays .row-sub { white-space: normal; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 10px; }
.spark-b { flex: 1; background: rgba(45,106,79,0.55); border-radius: 2px 2px 0 0; min-height: 2px; }
@media (prefers-color-scheme: dark) {
  .unitcard + .unitcard, .periodrow + .periodrow { border-top-color: rgba(255,255,255,0.12); }
  .bar { background: rgba(255,255,255,0.14); }
  .pc-upcoming { background: rgba(255,255,255,0.12); }
  .periodrow-now { background: rgba(45,106,79,0.16); }
  .prow-pays { border-top-color: rgba(255,255,255,0.18); }
}
</style>

<script>
// ==== Hearth & Ledger -> Property_Manager.xlsx surgical patcher ====
// Rewrites only data rows of Income Log / Expense Log and the property
// header cells on the Properties sheet. Charts, formulas, formatting untouched.

const HL_INCOME_MAP = { 'Rent': 'Rent', 'Security Deposit': 'Deposit' };
const HL_EXPENSE_SET = ['Maintenance', 'Utilities', 'Service Charges', 'Insurance', 'Property Tax', 'Management Fees', 'Other'];
const HL_EXPENSE_MAP = {
  'Repair & Maintenance': 'Maintenance', 'Repairs': 'Maintenance', 'Supplies': 'Maintenance',
  'Property Taxes': 'Property Tax', 'DLD': 'Other', 'Mortgage': 'Other',
  'Management Fee': 'Management Fees', 'Property Management': 'Management Fees',
  'Commission': 'Management Fees', 'Commision': 'Management Fees'
};

function hlXmlEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function hlDateSerial(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  if (!m) return null;
  return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 864e5);
}
function hlMapCat(cat, isIncome) {
  const c = String(cat || '').trim();
  if (isIncome) {
    if (HL_INCOME_MAP[c]) return { cat: HL_INCOME_MAP[c], mapped: HL_INCOME_MAP[c] === c };
    return { cat: 'Other', mapped: false };
  }
  if (HL_EXPENSE_SET.indexOf(c) !== -1) return { cat: c, mapped: true };
  if (HL_EXPENSE_MAP[c]) return { cat: HL_EXPENSE_MAP[c], mapped: false };
  return { cat: 'Other', mapped: false };
}
function hlColStyles(xml, rowNum) {
  const styles = {};
  const rm = new RegExp('<row[^>]*\\br="' + rowNum + '"[^>]*>([\\s\\S]*?)</row>').exec(xml);
  if (!rm) return styles;
  for (const col of ['A', 'B', 'C', 'D', 'E']) {
    const cm = new RegExp('<c[^>]*\\br="' + col + rowNum + '"[^>]*?\\bs="(\\d+)"').exec(rm[1]);
    if (cm) styles[col] = cm[1];
  }
  return styles;
}
function hlBuildRows(entries, evenS, oddS, minRows) {
  const S = (col, r) => {
    const st = (r % 2 === 0 ? evenS : oddS)[col] || (r % 2 === 0 ? oddS : evenS)[col];
    return st !== undefined ? ' s="' + st + '"' : '';
  };
  let out = '';
  const total = Math.max(minRows, entries.length);
  for (let i = 0; i < total; i++) {
    const r = i + 2;
    if (i < entries.length) {
      const e = entries[i];
      const ser = hlDateSerial(e.date);
      out += '<row r="' + r + '">'
        + (ser !== null ? '<c r="A' + r + '"' + S('A', r) + '><v>' + ser + '</v></c>' : '<c r="A' + r + '"' + S('A', r) + '/>')
        + '<c r="B' + r + '"' + S('B', r) + ' t="inlineStr"><is><t>' + hlXmlEsc(e.property) + '</t></is></c>'
        + '<c r="C' + r + '"' + S('C', r) + ' t="inlineStr"><is><t>' + hlXmlEsc(e.category) + '</t></is></c>'
        + '<c r="D' + r + '"' + S('D', r) + '><v>' + (Number(e.amount) || 0) + '</v></c>'
        + (e.notes ? '<c r="E' + r + '"' + S('E', r) + ' t="inlineStr"><is><t>' + hlXmlEsc(e.notes) + '</t></is></c>' : '<c r="E' + r + '"' + S('E', r) + '/>')
        + '</row>';
    } else {
      out += '<row r="' + r + '">'
        + ['A', 'B', 'C', 'D', 'E'].map(col => '<c r="' + col + r + '"' + S(col, r) + '/>').join('')
        + '</row>';
    }
  }
  return out;
}
function hlReplaceDataRows(xml, rowsXml, lastRow) {
  const start = xml.search(/<row[^>]*\br="2"[^>]*>/);
  const endTag = xml.indexOf('</sheetData>');
  if (endTag === -1) throw new Error('sheetData not found');
  let head, tail = xml.slice(endTag);
  if (start !== -1 && start < endTag) head = xml.slice(0, start);
  else head = xml.slice(0, endTag);
  let result = head + rowsXml + tail;
  result = result.replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A1:E' + lastRow + '"/>');
  return result;
}
function hlSetCell(xml, ref, inner, type) {
  const re = new RegExp('<c[^>]*\\br="' + ref + '"[^>]*?(?:/>|>[\\s\\S]*?</c>)');
  const m = re.exec(xml);
  let sAttr = '';
  if (m) {
    const sm = /\bs="(\d+)"/.exec(m[0]);
    if (sm) sAttr = ' s="' + sm[1] + '"';
  }
  const cell = type === 'n'
    ? '<c r="' + ref + '"' + sAttr + '><v>' + inner + '</v></c>'
    : '<c r="' + ref + '"' + sAttr + ' t="inlineStr"><is><t>' + hlXmlEsc(inner) + '</t></is></c>';
  if (m) return xml.replace(re, cell);
  return xml; // cell absent: skip silently
}

async function hlPatchWorkbook(JSZipLib, arrayBuffer, data) {
  const zip = await JSZipLib.loadAsync(arrayBuffer);
  const wbXml = await zip.file('xl/workbook.xml').async('string');
  const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');

  const sheetPath = name => {
    const sm = new RegExp('<sheet[^>]*\\bname="' + name + '"[^>]*\\br:id="(rId\\d+)"').exec(wbXml)
      || new RegExp('<sheet[^>]*\\br:id="(rId\\d+)"[^>]*\\bname="' + name + '"').exec(wbXml);
    if (!sm) throw new Error('Sheet "' + name + '" not found — is this the Property Manager workbook?');
    const rm = new RegExp('<Relationship[^>]*\\bId="' + sm[1] + '"[^>]*\\bTarget="([^"]+)"').exec(relsXml)
      || new RegExp('<Relationship[^>]*\\bTarget="([^"]+)"[^>]*\\bId="' + sm[1] + '"').exec(relsXml);
    if (!rm) throw new Error('Relationship for sheet "' + name + '" not found');
    let t = rm[1].replace(/^\//, '');
    return t.indexOf('xl/') === 0 ? t : 'xl/' + t;
  };

  const propById = {};
  (data.properties || []).forEach(p => { propById[p.id] = p; });

  const prep = (items, isIncome) => {
    let remapped = 0;
    const rows = (items || []).slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .map(e => {
        const mc = hlMapCat(e.category, isIncome);
        if (!mc.mapped && e.category) remapped++;
        const notes = (!mc.mapped && e.category && mc.cat !== e.category)
          ? (e.notes ? e.notes + ' [' + e.category + ']' : '[' + e.category + ']')
          : (e.notes || '');
        const notes2 = e.rentMonth ? (notes ? notes + ' ' : '') + '(for ' + e.rentMonth + ')' : notes;
        return {
          date: e.date,
          property: (propById[e.propertyId] && propById[e.propertyId].name) || '',
          category: mc.cat,
          amount: e.amount,
          notes: notes2
        };
      });
    return { rows, remapped };
  };

  const inc = prep(data.income, true);
  const exp = prep(data.expenses, false);

  for (const [name, ds] of [['Income Log', inc], ['Expense Log', exp]]) {
    const path = sheetPath(name);
    let xml = await zip.file(path).async('string');
    const evenS = hlColStyles(xml, 2), oddS = hlColStyles(xml, 3);
    const minRows = 300;
    const rowsXml = hlBuildRows(ds.rows, evenS, oddS, minRows);
    xml = hlReplaceDataRows(xml, rowsXml, Math.max(minRows, ds.rows.length) + 1);
    zip.file(path, xml);
  }

  // Properties sheet: names, purchase price, current value for first two properties
  const props = (data.properties || []).slice(0, 2);
  if (props.length) {
    const path = sheetPath('Properties');
    let xml = await zip.file(path).async('string');
    const cols = ['B', 'C'];
    props.forEach((p, i) => {
      xml = hlSetCell(xml, cols[i] + '5', p.name || '', 's');
      if (p.address) xml = hlSetCell(xml, cols[i] + '6', p.address, 's');
      if (Number(p.purchasePrice) > 0) xml = hlSetCell(xml, cols[i] + '8', Number(p.purchasePrice), 'n');
      if (Number(p.currentValue) > 0) xml = hlSetCell(xml, cols[i] + '9', Number(p.currentValue), 'n');
    });
    zip.file(path, xml);
  }

  // Force full recalculation on next open
  let wb2 = wbXml;
  if (/<calcPr[^>]*\/>/.test(wb2)) {
    wb2 = wb2.replace(/<calcPr([^>]*?)\s*\bfullCalcOnLoad="[^"]*"([^>]*)\/>/, '<calcPr$1$2/>');
    wb2 = wb2.replace(/<calcPr([^>]*)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
  } else {
    wb2 = wb2.replace('</sheets>', '</sheets><calcPr fullCalcOnLoad="1"/>');
  }
  zip.file('xl/workbook.xml', wb2);

  // Drop stale calc chain if present
  if (zip.file('xl/calcChain.xml')) {
    zip.remove('xl/calcChain.xml');
    const ct = await zip.file('[Content_Types].xml').async('string');
    zip.file('[Content_Types].xml', ct.replace(/<Override[^>]*calcChain\.xml[^>]*\/>/, ''));
    const r2 = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    zip.file('xl/_rels/workbook.xml.rels', r2.replace(/<Relationship[^>]*calcChain\.xml[^>]*\/>/, ''));
  }

  const out = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
  const over = Math.max(inc.rows.length, exp.rows.length) > 300;
  return { bytes: out, incomeCount: inc.rows.length, expenseCount: exp.rows.length, remapped: inc.remapped + exp.remapped, over300: over, extraProps: (data.properties || []).length > 2 };
}



/* Hearth & Ledger — iOS edition. Built from scratch for iPhone. */
const { useState, useEffect, useMemo, useRef } = React;
const h = React.createElement;

/* ---------- data layer (same keys as previous app => data carries over) ---------- */
const K = { P: 'pm:properties', T: 'pm:tenants', I: 'pm:income', E: 'pm:expenses', C: 'pm:currency', L: 'pm:lastChange', UA: 'pm:utilAccounts', UB: 'pm:utilBills', DL: 'pm:dealer' };
function loadK(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function saveK(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert('Could not save (storage full?): ' + e.message); } }
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthKey = d => String(d || '').slice(0, 7);
const nowKey = () => new Date().toISOString().slice(0, 7);

/* ===== Contract-anchored rent period engine =====
   A lease starting 20 Jun bills 20 Jun-19 Jul, 20 Jul-19 Aug, ...
   A final short stretch is a stub period, pro-rated by days. */

function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
function pISO(s) { const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function iso(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function addD(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function dayDiff(a, b) { return Math.round((pISO(b) - pISO(a)) / 86400000); }
function validISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }

/* nth anniversary of the lease start, day-of-month clamped to short months */
function anchorDate(startISO, n) {
  const s = pISO(startISO), anchor = s.getDate();
  const b = new Date(s.getFullYear(), s.getMonth() + n, 1);
  b.setDate(Math.min(anchor, dim(b.getFullYear(), b.getMonth())));
  return b;
}

/* All billing periods for one lease. Open-ended leases roll 3 months past today. */
function buildPeriods(t, todayISO_) {
  const start = t.leaseStart;
  if (!validISO(start)) return [];
  const rent = Number(t.monthlyRent) || 0;
  const endISO = validISO(t.leaseEnd) ? t.leaseEnd : null;
  const horizon = endISO || iso(anchorDate(todayISO_ || iso(new Date()), 3));
  const out = [];
  for (let n = 0; n < 600; n++) {
    const from = anchorDate(start, n);
    if (iso(from) > horizon) break;
    let to = addD(anchorDate(start, n + 1), -1);
    let stub = false;
    if (endISO && iso(to) >= endISO) { to = pISO(endISO); stub = iso(to) < iso(addD(anchorDate(start, n + 1), -1)); }
    const fullDays = dayDiff(iso(from), iso(addD(anchorDate(start, n + 1), -1))) + 1;
    const days = dayDiff(iso(from), iso(to)) + 1;
    if (days <= 0) break;
    out.push({
      no: n + 1, key: iso(from), from: iso(from), to: iso(to),
      days: days, stub: stub,
      expected: stub ? Math.round(rent / fullDays * days * 100) / 100 : rent
    });
    if (endISO && iso(to) >= endISO) break;
  }
  return out;
}

/* Does this lease cover a calendar day? */
function leaseCoversDate(t, d) {
  if (!validISO(t.leaseStart) || d < t.leaseStart) return false;
  if (validISO(t.leaseEnd) && d > t.leaseEnd) return false;
  return true;
}

/* Pick the period a payment belongs to. Returns {key, why} or null. */
function matchPeriod(entry, periods) {
  if (!periods.length) return null;
  if (entry.periodKey && periods.some(p => p.key === entry.periodKey)) return { key: entry.periodKey, why: 'stored' };
  const d = entry.date;
  /* the period the money actually landed in is the strongest signal */
  const inside = periods.filter(p => d >= p.from && d <= p.to);
  if (inside.length) return { key: inside[0].key, why: 'paid within period' };
  const rm = entry.rentMonth;
  if (rm) {
    const spans = periods.filter(p => p.from.slice(0, 7) <= rm && p.to.slice(0, 7) >= rm);
    if (spans.length) return { key: spans[0].key, why: 'old month tag' };
    const byStart = periods.filter(p => p.from.slice(0, 7) === rm);
    if (byStart.length) return { key: byStart[0].key, why: 'old month tag' };
  }
  /* paid up to 10 days early for the next period */
  const soon = periods.filter(p => p.from > d && dayDiff(d, p.from) <= 10);
  if (soon.length) return { key: soon[0].key, why: 'paid-early' };
  const before = periods.filter(p => p.to < d);
  if (before.length) return { key: before[before.length - 1].key, why: 'nearest-past' };
  return { key: periods[0].key, why: 'first' };
}

/* Which tenant made this payment, when it was never recorded. */
function inferTenant(entry, tenants) {
  const pool = tenants.filter(t => t.propertyId === entry.propertyId && validISO(t.leaseStart));
  const hits = pool.filter(t => leaseCoversDate(t, entry.date));
  if (hits.length === 1) return { id: hits[0].id, why: 'lease covers payment date' };
  /* Only credit a pre-move-in payment when the amount looks like that tenant's rent,
     otherwise it usually belongs to the outgoing tenant. */
  const amt = Number(entry.amount) || 0;
  const early = pool.filter(t => {
    if (!(t.leaseStart > entry.date && dayDiff(entry.date, t.leaseStart) <= 10)) return false;
    const r = Number(t.monthlyRent) || 0;
    return r > 0 && Math.abs(amt - r) <= r * 0.1;
  });
  if (hits.length === 0 && early.length === 1) return { id: early[0].id, why: 'paid just before move-in' };
  if (hits.length > 1) return { id: null, why: hits.length + ' overlapping leases' };
  return { id: null, why: 'no lease covers this date' };
}

/* Status of a period given what has been received against it. */
function periodStatus(p, paid, todayStr) {
  const owed = p.expected - paid;
  if (owed <= 0.5) return 'settled';
  if (todayStr < p.from) return 'upcoming';
  if (paid > 0.5) return 'partial';
  return 'due';
}



/* ---------- DEWA / utility bills ----------
   Bills are billed to the owner's name but are the tenant's to pay, collected
   through the dealer. An unpaid balance is therefore a liability to chase, not

const UTIL_FIELDS = [

  { k: 'housing', label: 'Housing fee' }, { k: 'sewerage', label: 'Sewerage' },
  { k: 'other', label: 'Other services' }, { k: 'additional', label: 'Additional' }

const billCharge = b => UTIL_FIELDS.reduce((s, f) => s + (Number(b[f.k]) || 0), 0);
const monthStr = m => { const a = String(m).split('-'); return new Date(Number(a[0]), Number(a[1]) - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); };

/* Replay each account month by month so the closing balance is derived, never trusted. */
function buildUtility(accounts, bills) {
  return accounts.map(a => {
    const rows = bills.filter(b => b.accountId === a.id).slice()
      .sort((x, y) => String(x.month).localeCompare(String(y.month)));
    let bal = Number(a.openingBalance) || 0;
    let charged = 0, paid = 0;
    const months = rows.map(b => {
      const ch = billCharge(b), pay = Number(b.payments) || 0, adj = Number(b.adjustments) || 0;
      bal = Math.round((bal + ch + adj - pay) * 100) / 100;
      charged += ch; paid += pay;
      return Object.assign({}, b, { charge: Math.round(ch * 100) / 100, running: bal });
    });
    /* arrears began the month after the account was last at zero;
       if it was never at zero, it was already behind before the first month entered */
    let unpaidSince = null, clearedAt = -1;
    for (let i = 0; i < months.length; i++) if (months[i].running <= 0.5) clearedAt = i;
    if (bal > 0.5) {
      if (clearedAt >= 0 && clearedAt + 1 < months.length) unpaidSince = months[clearedAt + 1].month;
      else if (clearedAt < 0 && months.length) unpaidSince = (Number(a.openingBalance) || 0) > 0.5 ? 'before' : months[0].month;
    }
    const last = months.length ? months[months.length - 1] : null;
    return {
      a: a, months: months, balance: bal, charged: Math.round(charged * 100) / 100,
      paid: Math.round(paid * 100) / 100, last: last,
      lastPaidMonth: (months.filter(m => (Number(m.payments) || 0) > 0.5).pop() || {}).month || null,
      unpaidSince: bal > 0.5 ? unpaidSince : null,
      avg: months.length ? Math.round(charged / months.length * 100) / 100 : 0
    };
  });
}

/* ---------- rent book: every lease, every period, who paid what ---------- */
const dLabel = s => { if (!s) return ''; const d = pISO(s); return d.getDate() + ' ' + d.toLocaleDateString('en-US', { month: 'short' }); };
const dLabelY = s => { if (!s) return ''; const d = pISO(s); return d.getDate() + ' ' + d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); };

function buildBook(tenants, income, today) {
  const rent = income.filter(e => e.category === 'Rent');
  const resolved = rent.map(e => {
    let tid = e.tenantId || '', why = '';
    if (!tid) { const g = inferTenant(e, tenants); tid = g.id || ''; why = g.id ? g.why : g.why; }
    return { e: e, tenantId: tid, inferred: !e.tenantId && !!tid, note: why };
  });
  const byTenant = {};
  tenants.forEach(t => {
    const periods = buildPeriods(t, today).map(p => Object.assign({}, p, { paid: 0, entries: [] }));
    const idx = {}; periods.forEach(p => idx[p.key] = p);
    resolved.filter(r => r.tenantId === t.id).forEach(r => {
      const m = matchPeriod(r.e, periods);
      if (m && idx[m.key]) { idx[m.key].paid += Number(r.e.amount) || 0; idx[m.key].entries.push(r); }
    });
    periods.forEach(p => { p.status = periodStatus(p, p.paid, today); p.balance = Math.round((p.expected - p.paid) * 100) / 100; });
    const billed = periods.filter(p => p.from <= today);
    byTenant[t.id] = {
      t: t, periods: periods,
      expected: periods.reduce((s, p) => s + p.expected, 0),
      received: periods.reduce((s, p) => s + p.paid, 0),
      dueToDate: billed.reduce((s, p) => s + p.expected, 0),
      paidToDate: billed.reduce((s, p) => s + p.paid, 0),
      current: periods.find(p => today >= p.from && today <= p.to) || null,
      next: periods.find(p => p.from > today) || null,
      active: periods.length > 0 && today >= periods[0].from && today <= periods[periods.length - 1].to
    };
    byTenant[t.id].arrears = Math.round((byTenant[t.id].dueToDate - byTenant[t.id].paidToDate) * 100) / 100;
  });
  const unmatched = resolved.filter(r => !r.tenantId).map(r => r.e);
  return { byTenant: byTenant, unmatched: unmatched, resolved: resolved };
}

/* ---------- file saving: native Capacitor first, then web share, then download ---------- */
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('read failed'));
    r.onload = () => res(String(r.result).split(',')[1]);
    r.readAsDataURL(blob);
  });
}
async function saveFile(data, name, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const C = window.Capacitor;
  const P = C && (C.Plugins || {});
  if (P && P.Filesystem && P.Share) {
    try {
      const b64 = await blobToBase64(blob);
      const res = await P.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
      await P.Share.share({ title: name, url: res.uri });
      return 'shared';
    } catch (e) {
      if (/cancel|abort/i.test((e && e.message) || '')) return 'cancelled';
      /* fall through to web methods */
    }
  }
  try {
    if (typeof File !== 'undefined' && navigator.share && navigator.canShare) {
      const file = new File([blob], name, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return 'shared'; }
        catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
      }
    }
  } catch (e) {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return 'downloaded';
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('could not read file'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('file is not an image'));
      img.onload = () => {
        const MAX = 900;
        let w = img.width, hh = img.height;
        if (w > MAX || hh > MAX) { const k = Math.min(MAX / w, MAX / hh); w = Math.round(w * k); hh = Math.round(hh * k); }
        const c = document.createElement('canvas');
        c.width = w; c.height = hh;
        c.getContext('2d').drawImage(img, 0, 0, w, hh);
        const out = c.toDataURL('image/jpeg', 0.6);
        if (out.length > 450000) { reject(new Error('image too large even after compression')); return; }
        resolve(out);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- Dashboard ---------- */
function Dashboard({ properties, tenants, income, expenses, lastChange, openNew, book, goRent, fixUnmatched, util, dealer, goBills }) {
  const today = todayISO();
  const y = new Date().getFullYear(), curM = new Date().getMonth();
  const sum = a => a.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const incY = sum(income.filter(e => String(e.date).slice(0, 4) == y));
  const expY = sum(expenses.filter(e => String(e.date).slice(0, 4) == y));

  const books = Object.keys(book.byTenant).map(k => book.byTenant[k]);
  const outstanding = books.reduce((s, b) => s + Math.max(0, b.arrears), 0);

  /* --- one card per unit: who is in it, which period is running, what is owed --- */
  const units = properties.map(p => {
    const live = books.filter(b => b.t.propertyId === p.id && b.active);
    const past = books.filter(b => b.t.propertyId === p.id && !b.active && b.periods.length);
    past.sort((a, b2) => String(b2.periods[0].from).localeCompare(String(a.periods[0].from)));
    const b = live[0] || null;
    const arr = books.filter(b2 => b2.t.propertyId === p.id).reduce((s, b2) => s + Math.max(0, b2.arrears), 0);
    return { p: p, b: b, vacant: !b, last: past[0] || null, arrears: arr };
  });

  /* --- overdue and upcoming across every lease --- */
  const overdue = [];
  books.forEach(b => b.periods.forEach(p => {
    if ((p.status === 'due' || p.status === 'partial') && p.from <= today)
      overdue.push({ b: b, p: p, days: dayDiff(p.from, today) });
  }));
  overdue.sort((a, b2) => b2.days - a.days);
  const upcoming = [];
  books.forEach(b => b.periods.forEach(p => {
    if (p.status === 'upcoming' && dayDiff(today, p.from) <= 45) upcoming.push({ b: b, p: p, days: dayDiff(today, p.from) });
  }));
  upcoming.sort((a, b2) => a.days - b2.days);

  /* --- leases running out --- */
  const expiring = books.filter(b => b.active && b.t.leaseEnd && dayDiff(today, b.t.leaseEnd) <= 60)
    .map(b => ({ b: b, days: dayDiff(today, b.t.leaseEnd) })).sort((a, b2) => a.days - b2.days);

  /* --- yield / ROI, trailing 12 months so a part-year does not flatter the number --- */
  const cut = iso(new Date(new Date().getFullYear(), new Date().getMonth() - 11, 1));
  const perf = properties.map(p => {
    const i12 = sum(income.filter(e => e.propertyId === p.id && e.date >= cut));
    const e12 = sum(expenses.filter(e => e.propertyId === p.id && e.date >= cut));
    const pp = Number(p.purchasePrice) || 0, cv = Number(p.currentValue) || 0;
    const held = pp && p.purchaseDate ? Math.max(1, dayDiff(p.purchaseDate, today)) / 365 : 0;
    const months = new Array(12).fill(0);
    income.filter(e => e.propertyId === p.id).forEach(e => {
      const k = (new Date(e.date).getFullYear() - new Date().getFullYear()) * 12 + (new Date(e.date).getMonth() - new Date().getMonth()) + 11;
      if (k >= 0 && k < 12) months[k] += Number(e.amount) || 0;
    });
    return {
      p: p, i12: i12, e12: e12, net: i12 - e12, months: months,
      gross: pp ? i12 / pp : null, netY: pp ? (i12 - e12) / pp : null,
      cap: pp && cv ? (cv - pp) / pp : null,
      capAnn: pp && cv && held ? Math.pow(cv / pp, 1 / held) - 1 : null
    };
  });

  /* --- since purchase: how much of the price has the rent handed back --- */
  const recovery = properties.map(p => {
    const pp = Number(p.purchasePrice) || 0;
    const gross = sum(income.filter(e => e.propertyId === p.id));
    const costs = sum(expenses.filter(e => e.propertyId === p.id));
    const net = gross - costs;
    const yrs = p.purchaseDate ? Math.max(0.08, dayDiff(p.purchaseDate, today) / 365.25) : 0;
    const pace = yrs ? net / yrs : 0;
    return {
      p: p, pp: pp, gross: gross, costs: costs, net: net, yrs: yrs, pace: pace,
      grossPct: pp ? gross / pp : null, netPct: pp ? net / pp : null,
      left: Math.max(0, pp - net),
      yearsLeft: pace > 0 && pp ? (pp - net) / pace : null
    };
  });
  const totPaid = recovery.reduce((s, r) => s + r.pp, 0);
  const totNet = recovery.reduce((s, r) => s + r.net, 0);
  const totGross = recovery.reduce((s, r) => s + r.gross, 0);

  const strip = b => h('div', { className: 'pstrip' }, b.periods.map(p => h('div', {
    key: p.key, className: 'pcell pc-' + p.status, title: periodLabel(p),
    onClick: () => alert('Period ' + p.no + '\n' + periodLabel(p) + '\n\nExpected ' + fmtMoney(p.expected) + (p.stub ? '  (part period, ' + p.days + ' days)' : '') + '\nReceived ' + fmtMoney(p.paid) + (p.balance > 0.5 ? '\nOutstanding ' + fmtMoney(p.balance) : ''))
  }, p.no)));

  const bar = (got, exp) => h('div', { className: 'bar' }, h('div', { className: 'bar-fill' + (got >= exp - 0.5 ? ' bf-full' : got > 0 ? ' bf-part' : ' bf-none'), style: { width: Math.min(100, exp ? got / exp * 100 : 0) + '%' } }));

  const spark = vals => {
    const max = Math.max(1, ...vals);
    return h('div', { className: 'spark' }, vals.map((v, i) => h('div', { key: i, className: 'spark-b', style: { height: Math.max(2, v / max * 100) + '%' } })));
  };

  const byM = yr => { const a = new Array(12).fill(0); income.forEach(e => { const d = new Date(e.date); if (d.getFullYear() === yr) a[d.getMonth()] += Number(e.amount) || 0; }); return a; };
  const cur = byM(y), prev = byM(y - 1);
  const maxV = Math.max(1, ...cur, ...prev);
  const pct = v => Math.max(v > 0 ? 3 : 0, Math.round(v / maxV * 100));

  const sub = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
    (lastChange ? ' \u00b7 updated ' + new Date(lastChange).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '');

    h('div', { className: 'kpis kpis-4' },
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, 'Received ' + y), h('div', { className: 'kpi-v green' }, fmtMoney(incY))),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, 'Expenses'), h('div', { className: 'kpi-v red' }, fmtMoney(expY))),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, 'Net'), h('div', { className: 'kpi-v' }, fmtMoney(incY - expY))),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, 'Outstanding'), h('div', { className: 'kpi-v ' + (outstanding > 0.5 ? 'red' : 'green') }, fmtMoney(outstanding)))),

      units.length === 0 ? h(Row, { label: 'No properties yet', sub: 'Add one under More \u2192 Properties' }) :
      units.map(u => h('div', { key: u.p.id, className: 'unitcard' },

          u.b ? h(Pill, { kind: u.b.arrears > 0.5 ? 'unpaid' : 'paid', text: u.b.arrears > 0.5 ? fmtMoney(u.b.arrears) + ' owed' : 'Up to date' })
              : h(Pill, { kind: 'past', text: 'Vacant' })),
        u.b && u.b.current ? h('div', { className: 'unitcard-body' },

/* ---------- Rent tab ---------- */
function RentTab({ properties, tenants, income, addEntries, removeEntries, openNew, book, focus, setFocus }) {
  const today = todayISO();
  const books = Object.keys(book.byTenant).map(k => book.byTenant[k]).filter(b => b.periods.length);
  const live = books.filter(b => b.active);
  const ended = books.filter(b => !b.active);
  ended.sort((a, b) => String(b.periods[0].from).localeCompare(String(a.periods[0].from)));
  const ordered = live.concat(ended);
  const sel = ordered.find(b => b.t.id === focus) || ordered[0] || null;
  const pname = id => { const p = properties.find(x => x.id === id); return p ? p.name : '\u2014'; };

  const record = p => {
    const owed = Math.round((p.expected - p.paid) * 100) / 100;
    if (owed <= 0) return;
    if (!confirm('Record ' + fmtMoney(owed) + ' from ' + sel.t.name + '\n\nFor ' + periodLabel(p) + (p.stub ? '\n(part period, ' + p.days + ' days)' : ''))) return;
    addEntries('income', [{
      id: uid(), date: todayISO(), propertyId: sel.t.propertyId || '', tenantId: sel.t.id,
      category: 'Rent', amount: owed, notes: 'Rent ' + periodLabel(p),
      periodKey: p.key, rentMonth: p.from.slice(0, 7)
    }]);
  };
  const undo = p => {
    const ids = p.entries.map(r => r.e.id);
    if (!ids.length) return;
    if (!confirm('Remove ' + ids.length + ' payment' + (ids.length === 1 ? '' : 's') + ' recorded against ' + periodLabel(p) + '?')) return;
    removeEntries('income', ids);
  };

  if (!sel) return h(Screen, { title: 'Rent', right: h(NavBtn, { label: '+ Add', onClick: openNew }) },
    h(Group, {}, h(Row, { label: 'No leases yet', sub: 'Add a tenant with a lease start date under More \u2192 Tenants' })));

  const pillFor = st => st === 'settled' ? { kind: 'paid', text: 'Paid' } : st === 'partial' ? { kind: 'partial', text: 'Part paid' } : st === 'due' ? { kind: 'unpaid', text: 'Due' } : { kind: 'past', text: 'Upcoming' };

  return h(Screen, {
    title: 'Rent',
    subtitle: fmtMoney(sel.paidToDate) + ' of ' + fmtMoney(sel.dueToDate) + ' collected to date',
    right: h(NavBtn, { label: '+ Add', onClick: openNew })
  },
    h('div', { className: 'group', style: { padding: '10px 16px' } },
      h(FRow, { label: 'Lease' }, h(FSelect, { value: sel.t.id, onChange: e => setFocus(e.target.value) },
        live.length ? h('optgroup', { label: 'Current' }, live.map(b => Opt(b.t.id, b.t.name + ' \u00b7 ' + pname(b.t.propertyId)))) : null,
        ended.length ? h('optgroup', { label: 'Past' }, ended.map(b => Opt(b.t.id, b.t.name + ' \u00b7 ' + pname(b.t.propertyId)))) : null))),

    h('div', { className: 'kpis kpis-3' },
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, 'Contract'), h('div', { className: 'kpi-v', style: { fontSize: 15 } }, fmtMoney(sel.expected))),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, 'Received'), h('div', { className: 'kpi-v green', style: { fontSize: 15 } }, fmtMoney(sel.received))),
      h('div', { className: 'kpi' }, h('div', { className: 'kpi-l' }, sel.arrears > 0.5 ? 'Owed now' : 'Balance'),
        h('div', { className: 'kpi-v ' + (sel.arrears > 0.5 ? 'red' : 'green'), style: { fontSize: 15 } }, fmtMoney(Math.abs(sel.arrears))))),

    h(Group, {
      title: 'PERIODS \u00b7 ' + dLabelY(sel.t.leaseStart) + ' to ' + (sel.t.leaseEnd ? dLabelY(sel.t.leaseEnd) : 'open'),
      footer: 'Generated from the lease start date. A short final stretch is charged pro rata by day.'
    },
      sel.periods.map(p => h('div', { key: p.key, className: 'periodrow' + (p.from <= today && today <= p.to ? ' periodrow-now' : '') },
        h('div', { className: 'prow-line' },
          h('div', null,
            h('div', { className: 'row-label' }, 'Period ' + p.no + (p.stub ? '  \u00b7 ' + p.days + ' days' : '')),
            h('div', { className: 'row-sub' }, periodLabel(p))),
          h(Pill, pillFor(p.status))),
        h('div', { className: 'prow-line', style: { marginTop: 8 } },
          h('span', { className: 'row-sub' }, fmtMoney(p.paid) + ' / ' + fmtMoney(p.expected)),
          p.status === 'settled'
            ? (p.entries.length ? h('button', { className: 'mini-btn mini-2nd', onClick: () => undo(p) }, 'Undo') : null)
            : h('button', { className: 'mini-btn', onClick: () => record(p) }, p.status === 'partial' ? 'Collect rest' : 'Record payment')),
        p.entries.length ? h('div', { className: 'prow-pays' }, p.entries.map(r => h('div', { key: r.e.id, className: 'row-sub' },
          '\u2713 ' + fmtMoney(r.e.amount) + ' on ' + dLabelY(r.e.date) + ' \u00b7 ' + sel.t.name + (r.inferred ? ' (matched automatically)' : '')))) : null))),

    h(Group, { footer: 'Every payment recorded here is stamped with this tenant and this period, so the ledger always shows who paid and what it covered.' }));
}

/* ---------- Ledger ---------- */
function Ledger({ properties, tenants, income, expenses, openEntry, openNew, book }) {
  const [filter, setFilter] = useState('All');
  const all = income.map(e => ({ e, kind: 'income' })).concat(expenses.map(e => ({ e, kind: 'expense' })))
    .filter(x => filter === 'All' || (filter === 'Income' ? x.kind === 'income' : x.kind === 'expense'))
    .sort((a, b) => String(b.e.date).localeCompare(String(a.e.date)));
  const groups = [];
  all.forEach(x => {
    const k = monthKey(x.e.date);
    let g = groups[groups.length - 1];
    if (!g || g.k !== k) { g = { k, items: [] }; groups.push(g); }
    g.items.push(x);
  });
  const pname = id => { const p = properties.find(p2 => p2.id === id); return p ? p.name : id ? '?' : 'Unassigned'; };
  const payer = e => {
    const r = book.resolved.find(x => x.e.id === e.id);
    if (!r || !r.tenantId) return null;
    const b = book.byTenant[r.tenantId];
    if (!b) return null;
    const m = matchPeriod(e, b.periods);
    const p = m ? b.periods.find(x => x.key === m.key) : null;
    return { name: b.t.name, period: p ? periodLabel(p) : null, inferred: r.inferred };
  };
  return h(Screen, { title: 'Ledger', right: h(NavBtn, { label: '+ Add', onClick: openNew }) },
    h(Seg, { options: ['All', 'Income', 'Expenses'], value: filter, onChange: setFilter }),
    groups.length === 0 ? h(Group, {}, h(Row, { label: 'No entries yet', sub: 'Tap + Add to record income or an expense' })) :
    groups.map(g => h(Group, { key: g.k, title: monthLong(g.k).toUpperCase() },
      g.items.map(x => h(Row, {
        key: x.e.id,
        label: (function () {
          if (x.kind !== 'income') return x.e.category;
          const w = payer(x.e);
          return x.e.category + (w ? '  \u00b7 ' + w.name : '  \u00b7 no tenant');
        })(),
        sub: (function () {
          const base = pname(x.e.propertyId) + ' \u00b7 ' + new Date(x.e.date).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
          const w = x.kind === 'income' ? payer(x.e) : null;
          const per = w && w.period ? ' \u00b7 covers ' + w.period : '';
          return base + per + (x.e.notes ? ' \u00b7 ' + x.e.notes : '');
        })(),
        onClick: () => openEntry(x.kind, x.e),
        value: (x.kind === 'income' ? '+' : '\u2212') + fmtMoney(x.e.amount),
        valueClass: x.kind === 'income' ? 'green' : 'red',
        chevron: true
      }, x.e.photo ? h('span', { className: 'clip', onClick: ev => { ev.stopPropagation(); viewPhoto(x.e.photo); } }, '\ud83d\udcce') : null)))));
}

/* ---------- Entry sheet (add / edit) ---------- */
function EntrySheet({ open, initial, kind0, properties, tenants, onSave, onDelete, onClose, book }) {
  const [kind, setKind] = useState(kind0 || 'income');
  const [f, setF] = useState({});
  useEffect(() => {
    if (open) {
      setKind(kind0 || 'income');
      setF({
        date: (initial && initial.date) || todayISO(),
        propertyId: initial ? (initial.propertyId || '') : (properties[0] ? properties[0].id : ''),
        tenantId: (initial && initial.tenantId) || '',
        category: (initial && initial.category) || '',
        amount: (initial && initial.amount) || '',
        notes: (initial && initial.notes) || '',
        photo: (initial && initial.photo) || '',
        rentMonth: (initial && initial.rentMonth) || '',
        periodKey: (initial && initial.periodKey) || ''
      });
    }
  }, [open]);
  const u = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
  const cats = kind === 'income' ? INCOME_CATS : EXPENSE_CATS;
  const cat = f.category || cats[0];
  const tenantChoices = tenants.slice().sort((a, b) => {
    const ap = a.propertyId === f.propertyId ? 0 : 1, bp = b.propertyId === f.propertyId ? 0 : 1;
    if (ap !== bp) return ap - bp;
    return String(b.leaseStart || '').localeCompare(String(a.leaseStart || ''));
  });
  const tBook = f.tenantId && book ? book.byTenant[f.tenantId] : null;
  const periods = tBook ? tBook.periods : [];
  const chosen = periods.find(p => p.key === f.periodKey) || null;
  const pickPeriod = key => {
    const p = periods.find(x => x.key === key);
    setF(prev => {
      const nx = Object.assign({}, prev, { periodKey: key, rentMonth: p ? p.from.slice(0, 7) : '' });
      if (p && (!prev.amount || Number(prev.amount) === 0)) nx.amount = Math.max(0, Math.round((p.expected - p.paid) * 100) / 100);
      if (p && !prev.notes) nx.notes = 'Rent ' + periodLabel(p);
      return nx;
    });
  };
  const submit = () => {
    if (!f.amount || Number(f.amount) <= 0) { alert('Please enter an amount.'); return; }
    const entry = {
      id: initial ? initial.id : uid(),
      date: f.date || todayISO(),
      propertyId: f.propertyId || '',
      category: cat,
      amount: Number(f.amount),
      notes: f.notes || ''
    };
    if (kind === 'income') {

/* ---------- statements (print windows) ---------- */
const STMT_CSS = "body{font-family:-apple-system,'Segoe UI',sans-serif;color:#1a1a1a;max-width:720px;margin:24px auto;padding:0 16px;}h1{font-size:22px;margin-bottom:2px;}.sub{color:#8a8680;font-size:12px;margin-bottom:22px;}h2{font-size:16px;border-bottom:2px solid #2d4a3e;padding-bottom:4px;margin-top:28px;}h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8a8680;margin:14px 0 6px;}table{width:100%;border-collapse:collapse;font-size:12.5px;}td,th{padding:6px 8px;border-bottom:1px solid #eee;text-align:left;}.r{text-align:right;}.t td{font-weight:600;border-top:2px solid #ddd;}.net{text-align:right;font-size:14px;}.grand{margin-top:26px;padding:14px;background:#f5f2ea;border-radius:6px;font-size:14px;display:flex;justify-content:space-between;}@media print{.noprint{display:none}}";
function openStatement(title, body) {
  const full = '<!DOCTYPE html><html><head><title>' + esc(title) + '</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>' + STMT_CSS + '</style></head><body><h1>' + esc(title) + '</h1><div class="sub">Hearth &amp; Ledger \u00b7 generated ' + esc(new Date().toLocaleDateString()) + '</div>' + body + '</body></html>';
  if (window.__hlShowStatement) { window.__hlShowStatement({ title: title, html: full }); return; }
  const w = window.open('', '_blank');
  if (!w) { alert('Popup blocked \u2014 allow popups to generate statements.'); return; }
  w.document.write('<!DOCTYPE html><html><head><title>' + esc(title) + '</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>' + STMT_CSS + '</style></head><body><h1>' + esc(title) + '</h1><div class="sub">Hearth &amp; Ledger \u00b7 generated ' + esc(new Date().toLocaleDateString()) + '</div>' + body + '<p class="noprint" style="margin-top:20px;color:#8a8680;font-size:12px;">Use Print / Share \u2192 Print to save as PDF.</p></body></html>');
  w.document.close();
  setTimeout(() => { try { w.print(); } catch (e) {} }, 400);
}
function monthlyStatement(properties, income, expenses) {
  const def = nowKey();
  const mth = window.prompt('Statement month (YYYY-MM):', def);
  if (!mth) return;
  const key = mth.trim();
  if (!/^\d{4}-\d{2}$/.test(key)) { alert('Use YYYY-MM, e.g. ' + def); return; }
  let gi = 0, ge = 0, body = '';
  const section = (name, inc, exp) => {
    const it = inc.reduce((s, e) => s + (+e.amount || 0), 0), et = exp.reduce((s, e) => s + (+e.amount || 0), 0);
    gi += it; ge += et;
    const rows = l => l.map(e => '<tr><td>' + esc(e.date) + '</td><td>' + esc(e.category) + '</td><td>' + esc(e.notes || '') + '</td><td class="r">' + esc(fmtMoney(e.amount)) + '</td></tr>').join('');
    return '<h2>' + esc(name) + '</h2>' +
      (inc.length ? '<h3>Income</h3><table><tr><th>Date</th><th>Category</th><th>Notes</th><th class="r">Amount</th></tr>' + rows(inc) + '<tr class="t"><td colspan="3">Total income</td><td class="r">' + esc(fmtMoney(it)) + '</td></tr></table>' : '') +
      (exp.length ? '<h3>Expenses</h3><table><tr><th>Date</th><th>Category</th><th>Notes</th><th class="r">Amount</th></tr>' + rows(exp) + '<tr class="t"><td colspan="3">Total expenses</td><td class="r">' + esc(fmtMoney(et)) + '</td></tr></table>' : '') +
      '<p class="net">Net: <b>' + esc(fmtMoney(it - et)) + '</b></p>';
  };
  properties.concat([{ id: '', name: 'Unassigned' }]).forEach(p => {
    const inc = income.filter(i => (i.propertyId || '') === p.id && monthKey(i.date) === key);
    const exp = expenses.filter(e => (e.propertyId || '') === p.id && monthKey(e.date) === key);
    if (inc.length || exp.length) body += section(p.name, inc, exp);
  });
  if (!body) { alert('No entries in ' + monthLong(key) + '.'); return; }
  body += '<div class="grand"><span>Portfolio net for ' + esc(monthLong(key)) + '</span><b>' + esc(fmtMoney(gi - ge)) + '</b></div>';
  openStatement("Owner's Statement \u2014 " + monthLong(key), body);
}
function annualStatement(properties, income, expenses) {
  const yDef = String(new Date().getFullYear());
  const yIn = window.prompt('Statement year (YYYY):', yDef);
  if (!yIn) return;
  const yr = yIn.trim();
  if (!/^\d{4}$/.test(yr)) { alert('Use a 4-digit year.'); return; }
  let plist = properties, allMode = true;
  if (properties.length > 1) {
    const pick = window.prompt('Which property?\n0) All   ' + properties.map((p, i) => (i + 1) + ') ' + p.name).join('   '), '0');
    if (pick === null) return;
    const n = parseInt(pick, 10);
    if (n > 0 && n <= properties.length) { plist = [properties[n - 1]]; allMode = false; }
  }
  const mNames = new Array(12).fill(0).map((_, m) => new Date(+yr, m, 1).toLocaleDateString('en-US', { month: 'long' }));
  let grand = 0, any = false, body = '';
  const section = (name, inc, exp) => {
    const im = new Array(12).fill(0), em = new Array(12).fill(0);
    inc.forEach(e => { im[new Date(e.date).getMonth()] += +e.amount || 0; });
    exp.forEach(e => { em[new Date(e.date).getMonth()] += +e.amount || 0; });
    const it = im.reduce((a, b) => a + b, 0), et = em.reduce((a, b) => a + b, 0);
    grand += it - et;
    const cat = l => { const o = {}; l.forEach(e => { const c = e.category || 'Other'; o[c] = (o[c] || 0) + (+e.amount || 0); }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
    return '<h2>' + esc(name) + ' \u2014 ' + esc(yr) + '</h2><table><tr><th>Month</th><th class="r">Income</th><th class="r">Expenses</th><th class="r">Net</th></tr>' +
      mNames.map((n2, m) => '<tr' + (im[m] === 0 && em[m] === 0 ? ' style="color:#b5b1a8"' : '') + '><td>' + esc(n2) + '</td><td class="r">' + (im[m] ? esc(fmtMoney(im[m])) : '\u2014') + '</td><td class="r">' + (em[m] ? esc(fmtMoney(em[m])) : '\u2014') + '</td><td class="r">' + (im[m] || em[m] ? esc(fmtMoney(im[m] - em[m])) : '') + '</td></tr>').join('') +
      '<tr class="t"><td>Total</td><td class="r">' + esc(fmtMoney(it)) + '</td><td class="r">' + esc(fmtMoney(et)) + '</td><td class="r">' + esc(fmtMoney(it - et)) + '</td></tr></table>' +
      (inc.length ? '<h3>Income by category</h3><table>' + cat(inc).map(x => '<tr><td>' + esc(x[0]) + '</td><td class="r">' + esc(fmtMoney(x[1])) + '</td></tr>').join('') + '</table>' : '') +
      (exp.length ? '<h3>Expenses by category</h3><table>' + cat(exp).map(x => '<tr><td>' + esc(x[0]) + '</td><td class="r">' + esc(fmtMoney(x[1])) + '</td></tr>').join('') + '</table>' : '');
  };
  plist.concat(allMode ? [{ id: '', name: 'Unassigned' }] : []).forEach(p => {
    const inc = income.filter(i => (i.propertyId || '') === p.id && String(i.date).slice(0, 4) === yr);
    const exp = expenses.filter(e => (e.propertyId || '') === p.id && String(e.date).slice(0, 4) === yr);
    if (inc.length || exp.length) { any = true; body += section(p.name, inc, exp); }
  });
  if (!any) { alert('No entries for ' + yr + '.'); return; }
  body += '<div class="grand"><span>Net for ' + esc(yr) + (allMode ? ' (all)' : '') + '</span><b>' + esc(fmtMoney(grand)) + '</b></div>';
  openStatement('Annual Statement \u2014 ' + yr, body);
}

function BillSheet({ open, initial, accounts, onSave, onDelete, onClose }) {
  const [f, setF] = useState({});
  useEffect(() => {
    if (!open) return;
    setF(Object.assign({ month: String(todayISO()).slice(0, 7), payments: '', adjustments: '' },
      initial || {}, { accountId: (initial && initial.accountId) || (accounts[0] || {}).id || '' }));
  }, [open, initial]);
  const u = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const charge = UTIL_FIELDS.reduce((s, x) => s + num(f[x.k]), 0);

    if (!f.month || !/^\d{4}-\d{2}$/.test(f.month)) { alert('Enter the billing month as YYYY-MM'); return; }

    UTIL_FIELDS.forEach(x => rec[x.k] = num(f[x.k]));

  };
  return h(Sheet, { open, title: f.id ? 'Edit bill month' : 'Add bill month', onClose, tall: true },
    h('div', { className: 'group' },
      h(FRow, { label: 'Account' }, h(FSelect, { value: f.accountId || '', onChange: e => u('accountId', e.target.value) },
        accounts.map(a => Opt(a.id, a.label || a.accountNo)))),
      h(FRow, { label: 'Billing month' }, h(FInput, { type: 'month', value: f.month || '', onChange: e => u('month', e.target.value) }))),
    h('div', { className: 'group', style: { marginTop: 12 } },
      UTIL_FIELDS.map(x => h(FRow, { key: x.k, label: x.label },

    h('div', { className: 'group', style: { marginTop: 12 } },
      h(FRow, { label: 'Adjustments' }, h(FInput, { type: 'number', inputMode: 'decimal', placeholder: '0.00', value: f.adjustments === 0 ? '0' : (f.adjustments || ''), onChange: e => u('adjustments', e.target.value) })),
      h(FRow, { label: 'Paid this month' }, h(FInput, { type: 'number', inputMode: 'decimal', placeholder: '0.00', value: f.payments === 0 ? '0' : (f.payments || ''), onChange: e => u('payments', e.target.value) }))),
    h('div', { className: 'group', style: { marginTop: 12, padding: '12px 16px' } },
      h('div', { className: 'prow-line' }, h('span', { className: 'row-label' }, 'Month total'), h('span', { className: 'row-label' }, fmtMoney(charge)))),

    f.id ? h('div', { style: { padding: '0 16px 20px' } },
      h('button', { className: 'danger-btn', onClick: () => { if (confirm('Delete this bill month?')) { onDelete(f.id); onClose(); } } }, 'Delete month')) : null);
}

/* ---------- Assign old payments to a tenant ---------- */
function AssignSheet({ open, unmatched, properties, tenants, onAssign, onClose }) {
  const [pick, setPick] = useState({});
  useEffect(() => { if (open) setPick({}); }, [open]);
  const pname = id => { const p = properties.find(x => x.id === id); return p ? p.name : 'Unassigned'; };
  const chosen = Object.keys(pick).filter(k => pick[k]);
  const rows = unmatched.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const apply = () => {
    if (!chosen.length) { onClose(); return; }
    onAssign(chosen.map(id => ({ id: id, tenantId: pick[id] })));
    onClose();
  };
  return h(Sheet, { open, title: 'Payments with no tenant', onClose, tall: true },
    h('div', { className: 'group', style: { padding: '12px 16px' } },
      h('div', { className: 'row-sub' }, 'These payments count toward income but are not tied to anyone\u2019s rent, usually because they predate your tenant records. Pick a tenant to attach one, and it will land in that lease\u2019s periods automatically. Leave the rest as they are.')),
    rows.map(e => h('div', { key: e.id, className: 'periodrow' },
      h('div', { className: 'prow-line' },
        h('div', null,
          h('div', { className: 'row-label' }, fmtMoney(e.amount)),
          h('div', { className: 'row-sub' }, pname(e.propertyId) + ' \u00b7 ' + dLabelY(e.date) + (e.notes ? ' \u00b7 ' + e.notes : '')))),
      h('div', { style: { marginTop: 8 } },
        h(FSelect, { value: pick[e.id] || '', onChange: ev => setPick(p => Object.assign({}, p, { [e.id]: ev.target.value })) },
          Opt('', 'Leave unassigned'),
          tenants.filter(t => !e.propertyId || t.propertyId === e.propertyId)
            .map(t => Opt(t.id, t.name + (t.leaseStart ? '  \u00b7 ' + dLabel(t.leaseStart) + (t.leaseEnd ? '\u2013' + dLabel(t.leaseEnd) : '+') : ''))))))),
    h(BigButton, { label: chosen.length ? 'Attach ' + chosen.length + ' payment' + (chosen.length === 1 ? '' : 's') : 'Close', onClick: apply }));
}

function App() {
  const [tab, setTab] = useState('dash');
  const [rentFocus, setRentFocus] = useState('');
  const [assignOpen, setAssignOpen] = useState(false);
  const [billFocus, setBillFocus] = useState('');
  const [billSheet, setBillSheet] = useState(null);
  const [acctSheet, setAcctSheet] = useState(null);
  const [properties, setProperties] = useState(() => loadK(K.P, []));
  const [tenants, setTenants] = useState(() => loadK(K.T, []));
  const [income, setIncome] = useState(() => loadK(K.I, []));
  const [utilAccounts, setUtilAccounts] = useState(() => loadK(K.UA, []));
  const [utilBills, setUtilBills] = useState(() => loadK(K.UB, []));
  const [dealer, setDealer] = useState(() => loadK(K.DL, ''));
  const [expenses, setExpenses] = useState(() => loadK(K.E, []));
  const [currency, setCurrency0] = useState(() => loadK(K.C, 'AED'));
  const [lastChange, setLastChange] = useState(() => loadK(K.L, null));
  CURRENCY = currency;
  const touch = () => { const t = new Date().toISOString(); setLastChange(t); saveK(K.L, t); };
  const persist = { properties: [setProperties, K.P], tenants: [setTenants, K.T], income: [setIncome, K.I], expenses: [setExpenses, K.E], utilAccounts: [setUtilAccounts, K.UA], utilBills: [setUtilBills, K.UB] };
  const setList = (name, next) => { persist[name][0](next); saveK(persist[name][1], next); touch(); };
  const setCurrency = c => { setCurrency0(c); saveK(K.C, c); CURRENCY = c; touch(); };

  const [entrySheet, setEntrySheet] = useState(null); // {kind, initial} | {kind:'income', initial:null}
  const [propSheet, setPropSheet] = useState(false); const [propEditing, setPropEditing] = useState(null);
  const [tenSheet, setTenSheet] = useState(false); const [tenEditing, setTenEditing] = useState(null);
  const [stmt, setStmt] = useState(null);
  useEffect(() => { window.__hlShowStatement = setStmt; return () => { window.__hlShowStatement = null; }; }, []);

  const book = useMemo(() => buildBook(tenants, income, todayISO()), [tenants, income]);
  const util = useMemo(() => buildUtility(utilAccounts, utilBills), [utilAccounts, utilBills]);
  const saveBill = rec => setList('utilBills', utilBills.some(b => b.id === rec.id) ? utilBills.map(b => b.id === rec.id ? rec : b) : utilBills.concat([rec]));
  const saveAccount = rec => setList('utilAccounts', utilAccounts.some(a => a.id === rec.id) ? utilAccounts.map(a => a.id === rec.id ? rec : a) : utilAccounts.concat([rec]));
  const deleteAccount = id => { setList('utilAccounts', utilAccounts.filter(a => a.id !== id)); setList('utilBills', utilBills.filter(b => b.accountId !== id)); };
  const addEntries = (kind, arr) => setList(kind === 'income' ? 'income' : 'expenses', (kind === 'income' ? income : expenses).concat(arr));
  const removeEntries = (kind, ids) => setList(kind === 'income' ? 'income' : 'expenses', (kind === 'income' ? income : expenses).filter(e => ids.indexOf(e.id) === -1));
  const saveEntry = (kind, entry, prevKind) => {
    if (prevKind) {
      if (prevKind !== kind) {
        setList(prevKind === 'income' ? 'income' : 'expenses', (prevKind === 'income' ? income : expenses).filter(e => e.id !== entry.id));
        setTimeout(() => setList(kind === 'income' ? 'income' : 'expenses', (kind === 'income' ? income : expenses).concat([entry])), 0);
      } else {
        setList(kind === 'income' ? 'income' : 'expenses', (kind === 'income' ? income : expenses).map(e => e.id === entry.id ? entry : e));
      }
    } else addEntries(kind, [entry]);
  };
  const saveProperty = p => setList('properties', propEditing ? properties.map(x => x.id === p.id ? p : x) : properties.concat([p]));
  const saveTenant = (t, prev) => {
    if (prev) {
      if (String(prev.monthlyRent || '') !== String(t.monthlyRent || '') || String(prev.leaseStart || '') !== String(t.leaseStart || '') || String(prev.leaseEnd || '') !== String(t.leaseEnd || '')) {
        t.leaseHistory = (prev.leaseHistory || []).concat([{ changedAt: new Date().toISOString(), monthlyRent: prev.monthlyRent, leaseStart: prev.leaseStart, leaseEnd: prev.leaseEnd }]);
      } else t.leaseHistory = prev.leaseHistory || [];
      setList('tenants', tenants.map(x => x.id === t.id ? t : x));
    } else setList('tenants', tenants.concat([t]));
  };

  const updateWorkbook = async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    if (typeof JSZip === 'undefined') { alert('Zip library missing.'); return; }
    try {
      const res = await hlPatchWorkbook(JSZip, await file.arrayBuffer(), { properties, tenants, income, expenses });
      const r2 = await saveFile(res.bytes, file.name.replace(/\.xlsx$/i, '') + ' (updated).xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if (r2 === 'cancelled') return;
      alert('Workbook updated: ' + res.incomeCount + ' income + ' + res.expenseCount + ' expense entries written. Dashboard and charts preserved.' + (res.remapped ? '\n' + res.remapped + ' categories mapped to the workbook\u2019s list (original kept in Notes).' : ''));
    } catch (err) { alert('Update failed: ' + err.message + '\nMake sure you selected the Property_Manager workbook.'); }
  };
  const nativeCheck = () => {
    if (window.Capacitor && !(window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem && window.Capacitor.Plugins.Share)) {
      alert('This build is missing the native share plugins.\n\nOn the Mac run:\n1) npm install\n2) npx cap sync ios\n3) cd ios/App && pod install\nthen press Run in Xcode again.');
      return false;
    }
    return true;
  };
  const exportBackup = () => {
    const data = { app: 'HearthAndLedger', version: 2, exportedAt: new Date().toISOString(), properties, tenants, income, expenses, currency, utilAccounts, utilBills, dealer };
    if (!nativeCheck()) return;
    saveFile(JSON.stringify(data, null, 2), 'property-backup-' + todayISO() + '.json', 'application/json').then(r => {
      if (r === 'shared') alert('Backup shared \u2014 choose \u201cSave to Files\u201d or a cloud app to store it.');
      else if (r === 'downloaded') alert('Backup downloaded.');
    }).catch(err => alert('Export failed: ' + err.message));
  };
  const importBackup = async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const txt = await file.text();
      let d;
      try { d = JSON.parse(txt); }
      catch (e2) {
        const m = /window\.__HL_SEED__ = ([\s\S]*?);<\/script>/.exec(txt);
        if (!m) throw new Error('not a backup JSON or portable HTML file');
        d = JSON.parse(m[1]);
      }
      if (!d.properties) throw new Error('no data found in this file');
      if (!confirm('Replace all data on this device with the backup from ' + (d.exportedAt ? new Date(d.exportedAt).toLocaleString() : 'unknown date') + '?')) return;
      setList('properties', d.properties || []); setList('tenants', d.tenants || []);
      setList('income', d.income || []); setList('expenses', d.expenses || []);
      setList('utilAccounts', d.utilAccounts || []); setList('utilBills', d.utilBills || []);
      if (d.dealer) { setDealer(d.dealer); saveK(K.DL, d.dealer); }
      if (d.currency) setCurrency(d.currency);
      alert('Backup imported.');
    } catch (err) { alert('Import failed: ' + err.message); }
  };
  const copyBackup = async () => {
    const data = { app: 'HearthAndLedger', version: 2, exportedAt: new Date().toISOString(), properties, tenants, income, expenses, currency, utilAccounts, utilBills, dealer };
    const txt = JSON.stringify(data);
    try {
      await navigator.clipboard.writeText(txt);
      alert('Backup copied to clipboard (' + txt.length + ' characters).\nPaste it into Notes or a new file, and keep it safe. It can be restored later by saving the text as a .json file and using Import Backup.');
    } catch (e) { alert('Clipboard failed: ' + e.message); }
  };
  const importClipboard = async () => {
    try {
      const txt = await navigator.clipboard.readText();
      if (!txt || !txt.trim()) { alert('Clipboard is empty.'); return; }
      const d = JSON.parse(txt);
      if (!d.properties) throw new Error('clipboard does not contain a Hearth & Ledger backup');
      if (!confirm('Replace all data on this device with the backup from ' + (d.exportedAt ? new Date(d.exportedAt).toLocaleString() : 'unknown date') + '?\n(' + (d.income || []).length + ' income, ' + (d.expenses || []).length + ' expense entries)')) return;
      setList('properties', d.properties || []); setList('tenants', d.tenants || []);
      setList('income', d.income || []); setList('expenses', d.expenses || []);
      setList('utilAccounts', d.utilAccounts || []); setList('utilBills', d.utilBills || []);
      if (d.dealer) { setDealer(d.dealer); saveK(K.DL, d.dealer); }
      if (d.currency) setCurrency(d.currency);
      alert('Backup imported from clipboard.');
    } catch (err) { alert('Import failed: ' + err.message); }
  };
  const portableCopy = () => {
    try {
      let src = window.__HL_PRISTINE__ || '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const data = { app: 'HearthAndLedger', version: 2, exportedAt: new Date().toISOString(), properties, tenants, income, expenses, currency, utilAccounts, utilBills, dealer };
      const jsonStr = JSON.stringify(data).replace(/</g, '\\u003c');
      const rep = '<script id="hl-seed">window.__HL_SEED__ = ' + jsonStr + ';</scr' + 'ipt>';
      const tagRe = /<script id="hl-seed">[\s\S]*?<\/script>/;
      if (tagRe.test(src)) src = src.replace(tagRe, () => rep);
      else src = src.replace('<div id="root"', rep + '\n<div id="root"');
      if (!nativeCheck()) return;
      saveFile(src, 'zproperty.html', 'text/html').then(r => {
        if (r !== 'cancelled') alert('Portable copy saved with all data embedded. Replace your copy on OneDrive with it.');
      }).catch(err => alert('Could not generate: ' + err.message));
    } catch (err) { alert('Could not generate: ' + err.message); }
  };

  const screen =
    tab === 'dash' ? h(Dashboard, { properties, tenants, income, expenses, lastChange, book, util, dealer,
      goBills: id => { setBillFocus(id); setTab('bills'); },
      openNew: () => setEntrySheet({ kind: 'income', initial: null }),
      goRent: id => { setRentFocus(id); setTab('rent'); },
      fixUnmatched: () => setAssignOpen(true) }) :
    tab === 'rent' ? h(RentTab, { properties, tenants, income, addEntries, removeEntries, book,
      focus: rentFocus, setFocus: setRentFocus,
      openNew: () => setEntrySheet({ kind: 'income', initial: null }) }) :
    tab === 'bills' ? h(BillsTab, { properties, utilAccounts, utilBills, dealer, util,
      focus: billFocus, setFocus: setBillFocus,
      openBill: b => setBillSheet(b), openAccount: a => setAcctSheet(a || {}) }) :
    tab === 'ledger' ? h(Ledger, { properties, tenants, income, expenses, book, openNew: () => setEntrySheet({ kind: 'income', initial: null }), openEntry: (kind, e) => setEntrySheet({ kind, initial: e }) }) :
    h(MoreTab, { properties, tenants, income, expenses, currency, setCurrency,
      openProperty: p => { setPropEditing(p); setPropSheet(true); },
      openTenant: t => { setTenEditing(t); setTenSheet(true); },
      updateWorkbook, exportBackup, importBackup, portableCopy, copyBackup, importClipboard });

  return h(React.Fragment, null,
    h('div', { className: 'content' }, screen),
    h('div', { className: 'tabbar' }, TABS.map(t2 => h('button', {
      key: t2.id, className: 'tab' + (tab === t2.id ? ' tab-active' : ''), onClick: () => setTab(t2.id)
    }, t2.icon(tab === t2.id), h('span', { className: 'tab-label' }, t2.label)))),
    h(EntrySheet, { open: !!entrySheet, initial: entrySheet && entrySheet.initial, kind0: entrySheet && entrySheet.kind,
      properties, tenants, book,
      onSave: saveEntry, onDelete: (kind, id) => removeEntries(kind, [id]), onClose: () => setEntrySheet(null) }),
    h(PropertySheet, { open: propSheet, initial: propEditing, onSave: saveProperty,
      onDelete: id => setList('properties', properties.filter(p => p.id !== id)), onClose: () => setPropSheet(false) }),
    h(StatementViewer, { stmt: stmt, onClose: () => setStmt(null) }),
    h(TenantSheet, { open: tenSheet, initial: tenEditing, properties, onSave: saveTenant,
      onDelete: id => setList('tenants', tenants.filter(t => t.id !== id)), onClose: () => setTenSheet(false) }),
    h(BillSheet, { open: !!billSheet, initial: billSheet, accounts: utilAccounts,
      onSave: saveBill, onDelete: id => setList('utilBills', utilBills.filter(b => b.id !== id)),
      onClose: () => setBillSheet(null) }),
    h(AccountSheet, { open: !!acctSheet, initial: acctSheet && acctSheet.id ? acctSheet : null, properties,
      onSave: saveAccount, onDelete: deleteAccount, onClose: () => setAcctSheet(null) }),
    h(AssignSheet, { open: assignOpen, unmatched: book.unmatched, properties, tenants,
      onAssign: pairs => {
        const map = {}; pairs.forEach(p => map[p.id] = p.tenantId);
        setList('income', income.map(e => map[e.id] ? Object.assign({}, e, { tenantId: map[e.id] }) : e));
      },
      onClose: () => setAssignOpen(false) }));
}

/* ---------- seed + mount ---------- */
function applySeed() {
  try {
    var seed = window.__HL_SEED__;
    if (!seed || !seed.properties) return;
    var hasLocal = false;
    try {
      hasLocal = (loadK(K.P, []).length + loadK(K.I, []).length + loadK(K.E, []).length) > 0;
    } catch (e) {}
    var apply = false;
    if (!hasLocal) apply = true; else {
      var lc = loadK(K.L, null);
